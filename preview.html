  /* \u7EB5\u5411\u4E0B justify-content \u7BA1\u7684\u662F**\u7AD6\u76F4**\u5206\u5E03\uFF1A\u6574\u5217\u5C45\u4E2D\uFF0C\u4E0E\u5DE6\u4FA7\u7ED8\u56FE\u533A\u7684\u89C6\u89C9\u4E2D\u7EBF\u5BF9\u9F50\u3002
     \u26A0\uFE0F **\u5FC5\u987B\u662F \`safe center\` \u800C\u4E0D\u662F \`center\`**\uFF08[LEGEND-11]\uFF09\uFF1A\u672C\u5143\u7D20\u540C\u65F6\u662F\u6EDA\u52A8\u5BB9\u5668\uFF08\u4E0B\u65B9
     overflow-y:auto\uFF09\uFF0C\u800C\u5C45\u4E2D\u7684\u6EA2\u51FA\u662F**\u5F80\u4E24\u5934\u5BF9\u534A\u6EA2**\u7684\u2014\u2014\u4E0A\u534A\u622A\u8DD1\u5230\u6EDA\u52A8\u539F\u70B9\u4E4B\u4E0A\uFF0C
     scrollTop \u53C8\u4E0D\u80FD\u4E3A\u8D1F\uFF0C\u90A3\u90E8\u5206\u5C31**\u6C38\u8FDC\u6EDA\u4E0D\u5230**\uFF0836 \u9879\u65F6\u5B9E\u6D4B\u9996\u9879\u5728\u5BB9\u5668\u9876\u4E4B\u4E0A 362px\uFF0C
     \u524D\u516B\u4E5D\u9879\u7B49\u4E8E\u51ED\u7A7A\u6D88\u5931\uFF09\u3002\`safe\` \u7684\u8BED\u4E49\u6B63\u662F\u300C\u4E00\u65E6\u5BF9\u9F50\u4F1A\u5BFC\u81F4\u6EA2\u51FA\uFF0C\u5C31\u9000\u56DE start \u5BF9\u9F50\u300D\uFF1A
     \u4E0D\u6EA2\u51FA\u65F6\u7167\u5E38\u5C45\u4E2D\uFF0C\u6EA2\u51FA\u65F6\u81EA\u52A8\u4ECE\u9876\u90E8\u8D77\u6392\u3001\u6574\u5217\u53EF\u6EDA\u5B8C\u3002 */
  justify-content: safe center;
  /* [LEGEND-01] \u9879\u8DDD\u8D70\u7EB5\u5411\u4E13\u5C5E token\uFF0C**\u4E0D\u590D\u7528\u6362\u884C\u884C\u8DDD**\uFF08--spacing-legend-row-v\uFF0C4px\uFF09\uFF1A
     \u4E3B\u8F74\u8F6C\u6210\u7AD6\u76F4\u540E row-gap \u4F1A\u63A5\u7BA1\u9879\u4E0E\u9879\u7684\u95F4\u8DDD\uFF0C\u82E5\u4E0D\u663E\u5F0F\u8986\u76D6\u5C31\u4F1A\u9759\u9ED8\u5957\u7528\u4E3A"\u6362\u884C\u515C\u5E95"\u5B9A\u7684\u90A3\u4E2A\u503C\u3002
     \u4E24\u8005\u662F\u4E0D\u540C\u610F\u56FE\u2014\u2014\u6362\u884C\u884C\u8DDD\u662F\u6A2A\u6392\u653E\u4E0D\u4E0B\u65F6\u7684\u8865\u507F\uFF0C\u9879\u8DDD\u662F\u7EB5\u5217\u7684\u4E3B\u6392\u5E03\u8282\u594F\u3002 */
  row-gap: var(--spacing-legend-item-v);
  /* [LEGEND-11] \u7EB5\u5217\u6EA2\u51FA = \u5BB9\u5668\u5185\u7EB5\u5411\u6ED1\u52A8\uFF08\u4E0D\u5206\u9875\u3001\u4E0D\u622A\u65AD\u3001\u4E0D\u6362\u5217\uFF09\u3002
     \u751F\u6548\u524D\u63D0\u662F\u7236\u7EA7 .dv-chart__legend \u5141\u8BB8\u88AB\u538B\u7F29\uFF08min-height:0\uFF09\uFF0C\u89C1\u4E0B\u65B9\u3002 */
  overflow-y: auto;
}
.dv-legend--column.dv-legend--center { align-items: center; }
.dv-legend--column.dv-legend--right { align-items: flex-end; justify-content: safe center; }

/* [LEGEND-02] \u56FE\u4F8B\u9879 = marker + label\uFF1B\u6574\u9879\u4E3A\u70B9\u51FB / hover \u70ED\u533A */
.dv-legend-item {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-legend-marker-label);
  cursor: pointer;
  user-select: none;
}

/* [LEGEND-02][LEGEND-03] \u6807\u8BB0\u5BB9\u5668 size-legend-marker\uFF1BcurrentColor = \u7CFB\u5217\u8272\uFF08\u7ECF --dv-series-color \u4E0B\u53D1\uFF09 */
.dv-legend-marker {
  flex: none;
  width: var(--size-legend-marker);
  height: var(--size-legend-marker);
  color: var(--dv-series-color, currentColor);
}

/* [LEGEND-02] \u6807\u7B7E\uFF1A\u5B57\u53F7 / \u884C\u9AD8 / \u989C\u8272 / \u5B57\u4F53\u5168\u90E8\u8D70 token */
.dv-legend-label {
  font-size: var(--font-size-legend);
  line-height: var(--line-height-legend);
  color: var(--color-text-legend);
  font-family: var(--font-family-cn);
}

/* [LEGEND-13] \u7EB5\u5411\u5355\u5217\u56FE\u4F8B\u7684\u6807\u7B7E\u8D85\u5BBD\u5373\u7701\u7565\u53F7\u622A\u65AD\u3002**\u53EA\u7BA1\u7EB5\u5217**\uFF1A\u6A2A\u6392\u653E\u4E0D\u4E0B\u4F1A\u81EA\u52A8\u6362\u884C
   \uFF08LEGEND-01\uFF09\uFF0C\u957F\u540D\u79F0\u6491\u4E0D\u7206\u5BBD\u5EA6\uFF1B\u7EB5\u5217\u4E00\u9879\u4E00\u884C\u3001\u4E0D\u6362\u884C\uFF0C\u957F\u540D\u79F0\u4F1A\u4E00\u8DEF\u628A\u56FE\u4F8B\u6491\u5BBD\uFF0C
   \u800C\u56FE\u4F8B\u5BBD\u53C2\u4E0E\u300C\u56FE + \u95F4\u8DDD + \u56FE\u4F8B\u300D\u6574\u7EC4\u5C45\u4E2D\u7684\u5E03\u5C40\u8BA1\u7B97\uFF08PIE-09\uFF09\uFF0C\u6491\u5BBD\u5373\u6574\u7EC4\u504F\u79FB\u3002
   \u56FE\u4F8B\u6807\u7B7E\u662F HTML <span> \u4E0D\u662F SVG <text>\uFF0C\u6545\u622A\u65AD\u662F\u7EAF CSS \u2014\u2014 \u4E0D\u5FC5\u6D4B\u91CF\u3001\u4E0D\u5FC5\u4E8C\u5206\uFF1B
   \u5B8C\u6574\u540D\u79F0\u7531\u539F\u751F title \u515C\u5E95\uFF08\u56FE\u4F8B\u672C\u5C31\u6709 pointer events\uFF0C\u8981\u70B9\u51FB\u663E\u9690\uFF0C\u89C1 legend.js\uFF09\u3002 */
.dv-legend--column .dv-legend-label {
  max-width: var(--size-legend-label-max);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* [LEGEND-06] \u5173\u95ED\u6001\uFF1A\u6587\u5B57 + marker \u5747\u5207 color-text-quaternary\uFF08\u6BD4\u5E38\u6001\u7C7B\u7279\u5F02\u6027\u66F4\u9AD8\uFF0C\u80DC\u51FA\uFF09 */
.dv-legend-item--off .dv-legend-marker { color: var(--color-text-quaternary); }
.dv-legend-item--off .dv-legend-label { color: var(--color-text-quaternary); }

/* [LEGEND-14] \u5F3A\u8C03\u6863\u7684\u975E\u9009\u4E2D\u9879\uFF1A**\u538B\u4E0D\u900F\u660E\u5EA6\uFF0C\u4E0D\u6362\u8272**\u3002
   \u4E0E\u4E0A\u9762\u7684 --off \u523B\u610F\u7528\u4E24\u6761\u4E0D\u540C\u7684\u901A\u9053\uFF0C\u56E0\u4E3A\u8BED\u4E49\u4E0D\u540C\u2014\u2014quaternary \u662F\u300C\u5DF2\u5173\u95ED\u300D\uFF0C
   \u800C\u5F3A\u8C03\u6863\u4E0B\u4E00\u9879\u90FD\u6CA1\u5173\uFF08\u6570\u636E\u6784\u6210\u5B8C\u6574\uFF09\uFF0C\u53EA\u662F\u8BA9\u4F4D\u7ED9\u88AB\u5F3A\u8C03\u7684\u90A3\u9879\u3002\u6362\u6210 quaternary \u4F1A\u8BA9
   \u300C\u8FD9\u4E9B\u7CFB\u5217\u8FD8\u5728\u56FE\u4E0A\u300D\u8FD9\u4EF6\u4E8B\u8BFB\u4E0D\u51FA\u6765\u3002
   \u4E0E\u56FE\u5143\u5F31\u5316\u540C\u4E00\u4E2A token\uFF08--opacity-visualization-dim\uFF0CTHS/Ainvest 0.2\u3001iFinD-PC 0.1\uFF09\uFF1A
   \u540C\u4E00\u4E2A\u300C\u5F31\u5316\u300D\u8BED\u4E49\u4E0D\u8BE5\u6709\u4E24\u4E2A\u503C\uFF0C\u56FE\u4F8B\u4E0E\u56FE\u5143\u7684\u5F31\u5316\u7A0B\u5EA6\u56E0\u6B64\u6052\u7B49\u3002
   \u6574\u9879\u4E00\u8D77\u538B\uFF08marker + label \u540C\u964D\uFF09\uFF0C\u4E0D\u9010\u5143\u7D20\u5199\u2014\u2014marker \u7684\u8272\u662F currentColor \u8DDF\u968F\u7CFB\u5217\u8272\uFF0C
   \u5206\u5F00\u538B\u4F1A\u8BA9\u8272\u6807\u4E0E\u6587\u5B57\u51FA\u73B0\u4E24\u79CD\u6DF1\u6D45\u3002 */
.dv-legend-item--dim { opacity: var(--opacity-visualization-dim); }

/* [BAR-01] \u67F1\uFF1A\u586B\u5145\u8DDF\u968F\u6240\u5728\u5206\u7EC4 <g> \u7684 currentColor\uFF08= \u7CFB\u5217\u8272\uFF0C\u7531 L2 \u5199 --dv-series-i\uFF09\u3002
   hover \u5F31\u5316 / \u70B9\u51FB\u9690\u85CF\u7531 L2 \u63A7\u5236\u5206\u7EC4 <g> \u7684 opacity / \u79FB\u9664\uFF0C\u4E0D\u5728\u6B64\u8868\u8FBE\u3002 */
.dv-bar { fill: currentColor; }

/* [LINE-01] \u6298\u7EBF + \u6570\u636E\u70B9\uFF1A\u63CF\u8FB9/\u586B\u5145\u8DDF\u968F\u6240\u5728 <g> \u7684 currentColor\uFF08= \u7CFB\u5217\u8272\uFF09\u3002
   \u7EBF\u5BBD\u8D70 --size-line-stroke\uFF1B\u6570\u636E\u70B9\u63CF\u8FB9\u540C\u5BBD\uFF08\u9ED8\u8BA4\u6001\u5B9E\u5FC3\uFF0Chover \u767D\u5FC3\u65F6\u53EA\u7FFB fill\uFF09\u3002 */
.dv-line {
  fill: none;
  stroke: currentColor;
  stroke-width: var(--size-line-stroke);
  stroke-linejoin: round;
  stroke-linecap: round;
}
.dv-line-point {
  fill: currentColor;
  stroke: currentColor;
  stroke-width: var(--size-line-stroke);
}

/* \u6570\u636E\u70B9\u5BC6\u5EA6\u9759\u9ED8\uFF08specs/line.md\uFF1A\u70B9\u6570 > 13 \u9690\u85CF\u6240\u6709\u70B9\uFF0C\u79FB\u52A8/PC \u4E00\u81F4\uFF09\uFF1A
   \u70B9\u7559\u5728 DOM\uFF08\u5E26 data-i\uFF09\u4EC5\u89C6\u89C9\u9690\u85CF\u2014\u2014\u672A\u6765 tooltip/\u5341\u5B57\u51C6\u661F\u5207\u7247\u7ED9\u6700\u8FD1\u7C7B\u76EE\u7684\u70B9\u6302
   .is-active \u5373\u53EF\u5524\u51FA\uFF08\u89C4\u5219\u5728\u540E\u3001\u540C\u7279\u5F02\u6027\u4E0B\u58F0\u660E\u5E8F\u80DC\u51FA\uFF0C\u538B\u8FC7\u9759\u9ED8\uFF09\u3002 */
.points-muted .dv-line-point { opacity: 0; }
/* hover \u5524\u51FA\u70B9\u767D\u5FC3\uFF08specs/line.md\uFF09\uFF1A\u4E2D\u5FC3\u586B\u5145\u5207 token\uFF08THS/Ainvest \u4EAE\u767D\u6697\u9ED1\u3001
   iFinD = currentColor \u4FDD\u6301\u5B9E\u5FC3\uFF09\uFF0C\u63CF\u8FB9\u4E0D\u53D8 = \u7CFB\u5217\u8272 */
.dv-line-point.is-active {
  opacity: 1;
  fill: var(--color-visualization-line-point-hover);
}

/* \u591A\u6298\u7EBF\u7684\u975E\u4E3B\u7EBF\uFF08\u4E3B\u7EBF=\u9996\u6761\u58F0\u660E\u7EBF\u4FDD\u6301\u6807\u51C6\u7EBF\u5BBD\uFF0Cspecs/line.md\uFF09\uFF1A\u7EBF\u4E0E\u70B9\u63CF\u8FB9\u5207\u66F4\u7EC6\u7684 multi \u7EBF\u5BBD */
.lines-multi .dv-line,
.lines-multi .dv-line-point { stroke-width: var(--size-line-stroke-multi); }

/* \u4E3B\u7EBF\u6E10\u53D8\u9762\u79EF\uFF08\u53EF\u5F00\u542F\u914D\u7F6E\uFF0Cspecs/line.md\uFF09\uFF1A\u8272\u968F\u7CFB\u5217\uFF08currentColor\uFF09\uFF0C
   \u4E24\u7AEF\u900F\u660E\u5EA6\u7531 mark.js \u4ECE --opacity-line-area-from/-to \u5199\u5165 stop-opacity */
.dv-line-area { pointer-events: none; }
.dv-line-area-stop { stop-color: currentColor; }

/* \u5806\u53E0\u6298\u7EBF\u586B\u5145\u5E26\uFF08specs/line.md\uFF09\uFF1A\u6298\u7EBF\u4E0E\u5176\u7D2F\u8BA1\u57FA\u7EBF\u4E4B\u95F4\uFF0C\u4E0E\u7EBF\u540C\u8272\u30010.2 \u4E0D\u900F\u660E\u5EA6 */
.dv-line-stack-fill {
  fill: currentColor;
  fill-opacity: var(--opacity-line-stack-fill);
  pointer-events: none;
}

/* [PIE-01] \u6247\u533A\uFF1A\u586B\u5145\u8DDF\u968F\u6240\u5728\u5206\u7EC4 <g> \u7684 currentColor\uFF08= \u8BE5\u6247\u533A\u7684\u56FA\u5B9A\u8272\u69FD\uFF0CCOLOR-08\uFF09\u3002
   \u4E0E\u67F1\u540C\u4E00\u53E3\u5F84\u2014\u2014hover \u5F31\u5316 / \u70B9\u51FB\u9690\u85CF\u7531 L2 \u63A7\u5236\u5206\u7EC4 <g> \u7684 opacity / \u4E0D\u6E32\u67D3\uFF0C\u4E0D\u5728\u6B64\u8868\u8FBE\u3002
   \u4E0D\u8BBE\u63CF\u8FB9\uFF1A\u6247\u533A\u95F4\u65E0\u95F4\u9699\uFF08PIE-01\uFF09\uFF0C\u63CF\u8FB9\u4F1A\u5728\u76F8\u90BB\u6247\u533A\u4E4B\u95F4\u6324\u51FA\u4E00\u6761\u6BD4\u8BBE\u8BA1\u7A3F\u66F4\u5BBD\u7684\u7F1D\u3002 */
.dv-pie-sector { fill: currentColor; }

/* [PIE-12] \u5916\u4FA7\u6807\u7B7E\u7684\u5F15\u7EBF\uFF1A\u8DDF\u968F\u6240\u5728\u6247\u533A <g> \u7684 currentColor\uFF08= \u8BE5\u6247\u533A\u7684\u56FA\u5B9A\u8272\u69FD\uFF0CCOLOR-08\uFF09\u2014\u2014
   \u8272\u5F69\u5173\u8054\u7531\u7EBF\u627F\u62C5\uFF0C\u6587\u5B57\u624D\u5F97\u4EE5\u8D70\u4E2D\u6027\u8272\uFF08LABEL-09 \u6863\u2462\uFF09\u3002
   \u7EBF\u5BBD\u590D\u7528\u5168\u5E93\u7EC6\u7EBF\u5BBD --size-grid-line\uFF08\u7F51\u683C\u7EBF / \u8F74\u7EBF / tooltip \u6307\u793A\u7EBF\u540C\u6E90\uFF09\uFF0C\u4E0D\u8BBE\u81EA\u6709 token\u3002
   [PIE-17] \u5F15\u7EBF**\u53C2\u4E0E\u547D\u4E2D**\uFF08\u65E9\u5148\u662F pointer-events:none\uFF09\uFF1A\u5B83\u4E0E\u6247\u533A\u5728\u540C\u4E00\u4E2A <g> \u91CC\u3001\u7ED1\u7684\u662F
   \u540C\u4E00\u5957\u5904\u7406\u5668\uFF0C\u62A2\u4E0D\u62A2\u5F97\u5230\u90FD\u6307\u5411\u540C\u4E00\u4E2A\u6247\u533A\uFF0C\u90A3\u6761\u300C\u4F1A\u62A2\u8D70\u672C\u8BE5\u843D\u5230\u6247\u533A\u7684 hover\u300D\u7684\u987E\u8651\u4E0D\u6210\u7ACB\u3002 */
.dv-pie-label-line {
  fill: none;
  stroke: currentColor;
  stroke-width: var(--size-grid-line);
}
/* [PIE-17] \u5F15\u7EBF\u7684\u547D\u4E2D\u5E26\uFF1A\u4E0E\u53EF\u89C1\u5F15\u7EBF\u540C\u5F62\u540C\u70B9\u3001\u900F\u660E\u52A0\u7C97\uFF0C\u53EA\u4E3A\u8BA9 1px \u7684\u7EBF\u80FD\u88AB\u6307\u9488\u591F\u7740\u3002
   pointer-events:stroke \u2014\u2014 \u663E\u5F0F\u53EA\u8BA4\u63CF\u8FB9\uFF0C\u4E0D\u53D7 transparent \u662F\u5426\u7B97\u300C\u5DF2\u7ED8\u5236\u300D\u7684\u5B9E\u73B0\u5DEE\u5F02\u5F71\u54CD\uFF1B
   stroke-width \u7531 L2 \u6309\u6A21\u5757\u5E38\u91CF\u5199\u5728\u5143\u7D20\u4E0A\uFF08\u662F\u53EF\u70B9\u6027\u9608\u503C\uFF0C\u4E0D\u662F\u8BBE\u8BA1\u5C3A\u5BF8\uFF0C\u6545\u4E0D\u8FDB token\uFF09\u3002 */
.dv-pie-label-line-hit {
  fill: none;
  stroke: transparent;
  pointer-events: stroke;
}

/* [LABEL-02][LABEL-03][LABEL-08] \u6570\u636E\u6807\u7B7E\uFF1A\u5B57\u53F7\u662F\u552F\u4E00\u4E3B\u9898\u5206\u5316\u9879\uFF08--font-size-data-label\uFF09\uFF1B
   \u9ED8\u8BA4 fill=currentColor = \u6240\u5728 <g> \u7684\u7CFB\u5217\u8272\uFF08\u6863\u2460\uFF0C\u56FE\u5F62\u5916\u7A7A\u767D\u533A\uFF09\uFF1B
   pointer-events:none \u6C38\u4E0D\u62A2 hover \u547D\u4E2D\uFF08\u6807\u7B7E\u5C42\u5728 mark \u4E4B\u4E0A\uFF09\u3002 */
.dv-data-label {
  fill: currentColor;
  font-size: var(--font-size-data-label);
  font-weight: var(--font-weight-data-label);
  font-family: var(--font-family-number);
  font-variant-numeric: tabular-nums;
  pointer-events: none;
}
/* [LABEL-04] \u6863\u2461\uFF1A\u6807\u7B7E\u538B\u5728\u8272\u5757\u4E0A\u65F6\u6309\u5E95\u8272\u660E\u6697\u5207\u6362\uFF08\u6D45\u5E95\u6DF1\u5B57 / \u6DF1\u5E95\u6D45\u5B57\uFF09\uFF0C

   \u2460 **\u53D6\u9ED8\u8BA4\u534A\u5F84\u800C\u4E0D\u662F\u5F53\u524D R**\u2014\u2014\u672C\u7ED3\u6784\u4E0B \`avail = \u5BB9\u5668\u9AD8 \u2212 \u56FE\u4F8B\u9AD8 \u2212 gap\`\uFF0C\u56FE\u4F8B\u9AD8\u53CD\u8FC7\u6765\u51B3\u5B9A
      \u534A\u5F84\uFF0C\u82E5\u4E0A\u9650\u518D\u7531\u534A\u5F84\u7B97\u51FA\uFF0C\u5C31\u6210\u4E86\u300C\u56FE\u4F8B\u9AD8 \u2192 \u534A\u5F84 \u2192 \u56FE\u4F8B\u4E0A\u9650 \u2192 \u56FE\u4F8B\u9AD8\u300D\u7684\u5FAA\u73AF\uFF1B
      \u951A\u5728 token \u4E0A\uFF08\u4E00\u4E2A\u4E0E\u5F53\u524D\u5E03\u5C40\u65E0\u5173\u7684\u5E38\u91CF\uFF09\u4E00\u5200\u5207\u65AD\uFF0CL2 \u9996\u5E27\u91CF\u5230\u7684\u5C31\u5DF2\u662F\u5C01\u9876\u540E\u7684\u9AD8\u5EA6\uFF0C
      \u4E0D\u9700\u8981\u4E8C\u6B21\u91CD\u6392\u3002**\u6545\u672C\u6761\u7EAF CSS \u8868\u8FBE\u3001L2 \u4E00\u884C\u4E0D\u53C2\u4E0E**\uFF08\u5DE6\u53F3\u7ED3\u6784\u90A3\u6761\u4ECD\u8D70
      \`--dv-pie-legend-max-h\`\uFF0C\u4E24\u8005\u4E92\u4E0D\u8986\u76D6\uFF1A\u5404\u81EA\u7684\u9009\u62E9\u5668\u53EA\u547D\u4E2D\u81EA\u5DF1\u7684\u7ED3\u6784\uFF09\u3002
   \u2461 \u500D\u6570\u53D6 \xD71 \u800C\u975E \xD72\u2014\u2014\u6A2A\u6392\u6362\u884C\u7684\u56FE\u4F8B\u662F\u300C\u94FA\u5F00\u300D\u7684\uFF0C\u5360\u5230\u4E0E\u73AF\u7B49\u9AD8\u5C31\u5DF2\u7ECF\u548C\u73AF\u5E73\u5206\u4E86\u5361\u7247\uFF1B
      \u518D\u653E\u5BBD\u4F1A\u8BA9\u56FE\u4F8B\u55A7\u5BBE\u593A\u4E3B\uFF08\u7EB5\u5217\u7A84\uFF0C\u6545\u7ED9\u5230 \xD72\uFF09\u3002
   \`100%\` \u540C\u6837\u662F\u5FC5\u9700\u7684\u94B3\u5236\uFF1A\u5361\u7247\u6BD4 140 \u8FD8\u77EE\u65F6\u4E0D\u8BB8\u63A2\u51FA\u3002 */
.dv-chart--legend-bottom > .dv-chart__legend {
  display: flex;
  /* \u26A0\uFE0F **\u5FC5\u987B\u662F column**\uFF1A\u672C\u58F3\u5B50\u53EA\u8D1F\u8D23\u300C\u5C01\u9AD8\u300D\uFF0C\u6A2A\u5411\u5FC5\u987B\u539F\u6837\u8BA9\u4F4D\u7ED9\u5185\u90E8\u7684 .dv-legend\u3002
     row\uFF08flex \u9ED8\u8BA4\uFF09\u4F1A\u628A .dv-legend \u53D8\u6210\u4E3B\u8F74\u4E0A\u6536\u7F29\u5230\u5185\u5BB9\u5BBD\u7684\u9879 \u2014\u2014 \u9879\u5C11\u65F6\u5B83\u53EA\u6709\u5185\u5BB9\u90A3\u4E48\u5BBD\u3001
     \u8FD8\u8D34\u5728\u58F3\u5B50\u5DE6\u8FB9\uFF0C\u4E8E\u662F LEGEND-01 \u7684 justify-content:center \u6CA1\u6709\u5BCC\u4F59\u5BBD\u5EA6\u53EF\u5C45\u4E2D\uFF0C
     \u6574\u6761\u56FE\u4F8B\u584C\u5230\u5DE6\u5BF9\u9F50\uFF08\u5B9E\u6D4B 4 \u9879\u65F6\u56FE\u4F8B\u5757\u53EA\u6709 284/706 \u5BBD\u3001\u504F\u79BB\u4E2D\u7EBF 211px\uFF1B
     16 / 36 \u9879\u56E0\u5185\u5BB9\u672C\u5C31\u6491\u6EE1\u6574\u5BBD\u800C\u770B\u4E0D\u51FA\u6765\u2014\u2014**\u522B\u62FF\u9879\u591A\u7684\u622A\u56FE\u9A8C\u6536\u8FD9\u6761**\uFF09\u3002
     \u6362\u6210 column \u540E\u6A2A\u5411\u53D8\u6210\u4EA4\u53C9\u8F74\uFF0C\u9ED8\u8BA4 align-items:stretch \u8BA9 .dv-legend \u6062\u590D\u6EE1\u5BBD\uFF0C
     \u5C45\u4E2D\u91CD\u65B0\u7531\u5B83\u81EA\u5DF1\u7684 justify-content \u8BF4\u4E86\u7B97\u3002 */
  flex-direction: column;
  min-height: 0;
  max-height: min(calc(var(--size-donut-radius) * 2), 100%);
}
/* [LEGEND-11] \u6A2A\u6392\u6362\u884C\u6392\u5E03\u7684\u6EA2\u51FA\u540C\u6837\u662F\u300C\u5BB9\u5668\u5185\u7EB5\u5411\u6ED1\u52A8\u300D\u3002\u8FD9\u91CC**\u4E0D\u9700\u8981** \`safe center\`\uFF1A
   \u591A\u884C\u7684\u7AD6\u76F4\u5206\u5E03\u7531 align-content \u7BA1\uFF0C\u5176\u9ED8\u8BA4\u503C normal(\u2248stretch) \u672C\u5C31\u4ECE\u9876\u90E8\u8D77\u6392\uFF0C
   \u4E0D\u5B58\u5728\u7EB5\u5217\u90A3\u79CD\u300C\u5C45\u4E2D\u628A\u4E0A\u534A\u622A\u63A8\u5230\u6EDA\u52A8\u539F\u70B9\u4E4B\u4E0A\u300D\u7684\u9677\u9631\uFF08\u89C1 .dv-legend--column\uFF09\u3002 */
.dv-chart--legend-bottom .dv-legend { overflow-y: auto; min-height: 0; }

/* [LEGEND-11] \u56FE\u4F8B\u5757\u7684\u5916\u58F3\uFF1A\u9ED8\u8BA4\u8D34\u5408\u5185\u5BB9\uFF1B\u5728\u5DE6\u53F3\u7ED3\u6784\u4E0B\u8981\u80FD\u88AB\u538B\u7F29\u5230\u5BB9\u5668\u9AD8\u5EA6\u4EE5\u5185
   \uFF08flex \u5B50\u9879\u9ED8\u8BA4 min-height:auto = \u4E0D\u5C0F\u4E8E\u5185\u5BB9\uFF0C\u4E0D\u7ED9 0 \u7684\u8BDD\u5185\u90E8\u7684 overflow-y \u6C38\u8FDC\u4E0D\u89E6\u53D1\uFF0C
   \u56FE\u4F8B\u4F1A\u628A\u6574\u4E2A\u5361\u7247\u9876\u9AD8\u800C\u4E0D\u662F\u81EA\u5DF1\u6EDA\uFF09\u3002\u81EA\u8EAB\u4E5F\u505A flex\uFF0C\u597D\u8BA9\u5185\u90E8 .dv-legend \u6491\u6EE1\u53EF\u7528\u9AD8\u5EA6\u3002 */
.dv-chart--legend-right > .dv-chart__legend {
  display: flex;
  min-height: 0;
  min-width: 0;
  /* [PIE-09] \u56FE\u4F8B\u5757**\u81EA\u5DF1**\u5728\u4EA4\u53C9\u8F74\u4E0A\u5C45\u4E2D\uFF0C\u4E0E\u5DE6\u4FA7\u73AF\u7684\u89C6\u89C9\u4E2D\u7EBF\u5BF9\u9F50\u3002
     \u26A0\uFE0F \u4E0D\u80FD\u9760\u9ED8\u8BA4\u7684 stretch\uFF1A**\u4E00\u65E6 max-height \u751F\u6548\uFF0C\u62C9\u4F38\u5C31\u88AB\u622A\u65AD\u3001flex \u56DE\u9000\u6210 flex-start**\uFF0C
     \u4E8E\u662F\u5361\u7247\u62C9\u9AD8\u65F6\u73AF\u5728\u6B63\u4E2D\u3001\u56FE\u4F8B\u5374\u8D34\u7740\u9876\uFF08\u5B9E\u6D4B\u5361\u7247 1000px \u65F6\u73AF\u5FC3 y=468\u3001\u56FE\u4F8B\u5757\u4E2D\u5FC3 y=140\uFF09\u3002
     \`align-self:center\` \u8BA9\u8FD9\u4E2A\u5757\u6309\u81EA\u8EAB\u9AD8\u5EA6\uFF08\u5185\u5BB9\u9AD8\uFF0C\u5C01\u9876\u4E8E\u4E0B\u9762\u7684 max-height\uFF09\u5C45\u4E2D\uFF0C
     \u4E24\u5757\u56E0\u6B64\u5728\u4EFB\u610F\u5BB9\u5668\u9AD8\u5EA6\u4E0B\u5171\u4EAB\u540C\u4E00\u6761\u4E2D\u7EBF\u3002 */
  align-self: center;
  /* [PIE-09][LEGEND-11] \u4E24\u91CD\u4E0A\u9650\u53D6\u7D27\u8005\uFF1A
     \u2460 \`--dv-pie-legend-max-h\` \u2014\u2014 L2 \u6309\u56FE\u5143\u9AD8\u5EA6\u7B97\u597D\u5199\u8FDB\u6765\uFF08\u5F53\u524D = \u56FE\u5143\u9AD8 \xD7 2\uFF09\u3002
        \u6CA1\u6709\u5B83\u65F6\u56FE\u4F8B\u4F1A\u628A\u6574\u5F20\u5361\u7247\u65E0\u9650\u6491\u9AD8\u2014\u201436 \u6247\u533A\u80FD\u6491\u5230\u4E0A\u5343\u50CF\u7D20\uFF0C\u800C\u73AF\u4ECD\u53EA\u6709 2R\u3002
     \u2461 \`100%\` \u2014\u2014 \u5BB9\u5668\u6BD4 \u2460 \u8FD8\u77EE\u65F6\u4E0D\u8BB8\u63A2\u51FA\u5361\u7247\u3002**\u6539 align-self \u540E\u8FD9\u6761\u662F\u5FC5\u9700\u7684**\uFF1A
        stretch \u65F6\u4EE3\u662F\u300C\u88AB\u5BB9\u5668\u538B\u6241\u300D\u81EA\u7136\u4E0D\u4F1A\u6EA2\u51FA\uFF0C\u5C45\u4E2D\u4E4B\u540E\u9AD8\u5EA6\u7531\u5185\u5BB9\u8BF4\u4E86\u7B97\uFF0C
        \u5C11\u4E86\u8FD9\u9053\u94B3\u5236\uFF0C\u77EE\u5361\u7247\u91CC\u7684\u56FE\u4F8B\u4F1A\u4E0A\u4E0B\u53CC\u5411\u6EA2\u51FA\u5230\u5361\u7247\u5916\u3002
     \u7F3A\u7701\u503C\u53D6 100% \u800C\u975E none \u2014\u2014 min() \u91CC\u653E none \u4F1A\u8BA9\u6574\u6761\u58F0\u660E\u5931\u6548\u3002 */
  max-height: min(var(--dv-pie-legend-max-h, 100%), 100%);
}
/* \u7ED8\u56FE SVG\uFF1A
   \xB7 display:block \u2014\u2014 \u6D88\u9664 inline \u66FF\u6362\u5143\u7D20\u7684\u57FA\u7EBF\u964D\u90E8\u7A7A\u9699\uFF08\u5426\u5219 plot \u5BB9\u5668\u6BD4 svg \u9AD8\u7EA6\u534A\u884C\u7684\u964D\u90E8\u3001\u4E0B\u65B9\u591A\u4E00\u6761\u7A7A\u767D\uFF09\u3002
   \xB7 [DATAZOOM-01] overflow:visible \u2014\u2014 \u8D34\u8FB9\u7684\u7F29\u653E\u8F74\u624B\u67C4\u5176\u5C45\u4E2D\u63CF\u8FB9\u5916\u534A + \u6295\u5F71\u4F1A\u6EA2\u51FA grid \u8FB9\uFF08= \u65E0\u6807\u7B7E\u4FA7\u7684\u89C6\u53E3\u8FB9\uFF09\uFF0C
     \u653E\u884C\u8BA9\u5176\u6E32\u67D3\u8FDB\u5361\u7247\u5185\u8FB9\u8DDD\u3001\u4E0D\u88AB\u5207\u5E73\u3002\u56FE\u5143\u672C\u8EAB\u90FD\u5728 grid \u5185\uFF0C\u4E0D\u53D7\u5F71\u54CD\u3002 */
.dv-chart__plot > svg { display: block; overflow: visible; }

/* [TREEMAP-03..08] \u77E9\u5F62\u6811\u56FE\uFF1A\u4E0A\u7EA7\u8DEF\u5F84\u72EC\u5360\u5BFC\u822A\u5E26\uFF0C\u56FE\u9762\u9AD8\u5EA6\u7531\u771F\u5B9E\u5BB9\u5668\u6216 L3 \u9A8C\u6536\u5B9E\u4F8B\u63D0\u4F9B\u3002
 */
.dv-chart--treemap { width: 100%; }
.dv-chart--treemap > .dv-chart__plot { width: 100%; }
.dv-chart--treemap > .dv-chart__plot > .dv-treemap {
  overflow: hidden;
  border-radius: var(--radius-treemap-canvas);
}

/* [TREEMAP-03] \u5355\u5143\u95F4\u9694\u4E0E\u753B\u677F\u5916\u89D2\u5747\u7531\u4E3B\u9898 token \u63D0\u4F9B\uFF1B\u5185\u90E8\u5355\u5143\u4FDD\u6301\u76F4\u89D2\u4E14\u4E0D\u53E6\u52A0\u63CF\u8FB9\u3002 */
.dv-treemap-node__rect {
  fill: currentColor;
  stroke: var(--color-background-weak);
  stroke-width: var(--spacing-0);
}
.dv-treemap-node { cursor: pointer; }
.dv-treemap-node:focus-visible { outline: none; }
.dv-treemap-node:focus-visible .dv-treemap-node__rect {
  stroke: var(--color-text-primary);
  stroke-width: calc(var(--size-grid-line) * 2);
}
.dv-treemap-node__mask {
  pointer-events: none;
  fill: var(--color-visualization-highlight-block);
  opacity: 0;
}
.dv-treemap-node__mask.is-active { opacity: 1; }

/* [TREEMAP-05/12/16] \u5404\u5F62\u6001\u7684\u5B57\u53F7\u4E0A\u4E0B\u9650\u7531 token \u7ED9\u51FA\uFF1B\u540D\u79F0\u8D70\u7CFB\u7EDF\u5B57\u4F53\uFF0C\u6570\u503C\u8D70\u91D1\u878D\u6570\u5B57\u5B57\u4F53\u3002
   \u5355\u5143\u683C\u5185\u6587\u5B57\u56FA\u5B9A\u4F7F\u7528 84% \u767D\uFF0C\u4E0D\u518D\u56E0\u5E95\u8272\u52A8\u6001\u5207\u6362\u9ED1\u767D\u3002 */
.dv-treemap-label { pointer-events: none; }
.dv-treemap-label text { fill: var(--color-text-inverse-primary); }
.dv-treemap-label__name {
  font-family: var(--font-family-cn);
  font-size: var(--dv-treemap-name-size, var(--font-size-treemap-local-label-name));
  font-weight: var(--font-weight-treemap-name);
}
.dv-treemap-label__value {
  font-family: var(--font-family-number);
  font-size: var(--dv-treemap-value-size, var(--font-size-treemap-local-label-value));
  font-weight: var(--font-weight-data-label);
  font-variant-numeric: tabular-nums;
}

/* [IMAGECONTENT-03] \u901A\u7528\u56FE\u7247\u5185\u5BB9\u7ED3\u6784\uFF1B\u5177\u4F53\u56FE\u8868\u8D1F\u8D23\u524D\u666F\u8272\u4E0E\u5C3A\u5BF8 token\u3002 */
.dv-image-content { pointer-events: none; }
.dv-image-content__fallback-bg { fill: var(--color-background-layer1); }
.dv-image-content__fallback-text {
  fill: var(--color-text-primary);
  font-family: var(--font-family-cn);
  font-size: var(--dv-image-content-fallback-size);
  font-weight: var(--font-weight-bold);
}
.dv-treemap-label .dv-image-content__fallback-text { fill: var(--color-text-primary); }
.dv-image-content__label {
  font-family: var(--font-family-cn);
  font-size: var(--dv-image-content-label-size);
  font-weight: var(--dv-image-content-label-weight, var(--font-weight-regular));
}
.dv-image-content__value {
  font-family: var(--font-family-number);
  font-size: var(--dv-image-content-value-size);
  font-weight: var(--dv-image-content-value-weight, var(--font-weight-medium));
  font-synthesis: none;
  font-variant-numeric: tabular-nums;
}
.dv-treemap-label.dv-image-content {
  --dv-image-content-label-weight: var(--font-weight-treemap-name);
  --dv-image-content-value-weight: var(--font-weight-data-label);
}

/* [WATERFALL-03..15] \u7011\u5E03\u56FE\u4E13\u5C5E\u7ED3\u6784\u3002\u51E0\u4F55\u7531 L2 \u88C5\u914D\uFF1B\u6240\u6709\u989C\u8272\u3001\u5B57\u4F53\u3001\u7EBF\u5BBD\u4E0E\u900F\u660E\u5EA6\u8D70 token\u3002 */
.dv-chart--waterfall { width: 100%; }
.dv-chart--waterfall > .dv-chart__plot { width: 100%; }
.dv-waterfall-period {
  fill: var(--color-text-secondary);
  font-family: var(--font-family-cn);
  font-size: var(--font-size-large);
  font-weight: var(--font-weight-bold);
}
.dv-waterfall-connector {
  fill: none;
  stroke: var(--color-waterfall-connector);
  stroke-width: var(--size-waterfall-connector);
  stroke-dasharray: var(--dash-waterfall-connector);
}
.dv-waterfall-bar { fill: currentColor; }
.dv-waterfall-bar--delta-arrow { fill-opacity: var(--opacity-waterfall-delta-fill); }
.dv-waterfall-segment-divider {
  stroke: var(--color-background-layer1);
  stroke-width: var(--size-waterfall-connector);
}
.dv-waterfall-delta-cap {
  stroke: currentColor;
  stroke-width: var(--size-waterfall-delta-cap);
}
.dv-waterfall-direction-line {
  stroke: currentColor;
  stroke-width: var(--size-waterfall-arrow-line);
  opacity: var(--opacity-waterfall-delta-fill);
}
.dv-waterfall-direction-head {
  fill: currentColor;
  opacity: var(--opacity-waterfall-delta-fill);
}
.dv-waterfall-percent__bg { fill: currentColor; }
.dv-waterfall-percent__text {
  fill: var(--color-text-inverse-primary);
  font-family: var(--font-family-number);
  font-size: var(--font-size-xxs);
  font-weight: var(--font-weight-regular);
  font-variant-numeric: tabular-nums;
}
.dv-waterfall-value-label {
  font-size: var(--font-size-extra-small);
  font-weight: var(--font-weight-medium);
}
.dv-waterfall-segment-label {
  font-family: var(--font-family-cn);
  font-size: var(--font-size-extra-small);
  pointer-events: none;
}
.dv-waterfall-segment-label__name { font-weight: var(--font-weight-regular); }
.dv-waterfall-segment-label__value {
  font-family: var(--font-family-number);
  font-weight: var(--font-weight-medium);
  font-variant-numeric: tabular-nums;
}
.dv-waterfall-segment-label--solid .dv-waterfall-segment-label__name,
.dv-waterfall-segment-label--solid .dv-waterfall-segment-label__value {
  fill: var(--color-text-inverse-primary);
}
.dv-waterfall-segment-label--light .dv-waterfall-segment-label__name { fill: var(--color-text-secondary); }
.dv-waterfall-segment-label--light .dv-waterfall-segment-label__value { fill: var(--color-text-primary); }
.dv-waterfall-operator {
  fill: var(--color-text-axis);
  font-family: var(--font-family-cn);
  font-size: var(--font-size-axis);
  font-weight: var(--font-weight-axis);
}
.dv-waterfall-axis-value {
  font-family: var(--font-family-number);
  font-weight: var(--font-weight-bold);
  font-variant-numeric: tabular-nums;
}
.dv-waterfall-hit {
  fill: transparent;
  cursor: pointer;
}

/* [WATERMARK-05] \u6C34\u5370\uFF1A\u54C1\u724C logo <image>\uFF0C\u989C\u8272/\u900F\u660E\u5EA6\u70D8\u7119\u5728 SVG \u5185\u3001\u660E\u6697\u5404\u4E00\u4EFD\uFF08\u4E0D\u8D70 token \u94FE\u8DEF\uFF09\u3002
   pointer-events:none \u2014\u2014 \u6C38\u4E0D\u62A2\u9F20\u6807\uFF0C\u8D34\u6570\u636E\u4E4B\u4E0A\u4E5F\u4E0D\u5F71\u54CD hover/tooltip \u547D\u4E2D\u3002 */
.dv-watermark { pointer-events: none; }

/* [CALLOUT-13][CALLOUT-14] \u56FE\u8868\u6807\u6CE8\uFF1A\u5F3A\u8C03\u73AF + \u66F2\u7EBF\u5F15\u7EBF + \u7BAD\u5934 + \u591A\u884C\u6587\u5B57\u3002
   \u6574\u5C42 pointer-events:none \u2014\u2014 \u7EAF\u88C5\u9970\uFF0C\u6C38\u4E0D\u62A2 hover/tooltip \u547D\u4E2D\uFF08\u540C\u6C34\u5370\u4E0E\u6570\u636E\u6807\u7B7E\uFF09\u3002
   \u73AF\u4E0E\u5F15\u7EBF\u8D70**\u4E2D\u6027\u8272**\u4E0D\u8DDF\u968F\u7CFB\u5217\u8272\uFF1A\u6807\u6CE8\u662F\u7F16\u8F91\u6027\u6279\u6CE8\u3001\u4E0D\u662F\u7CFB\u5217\u8BFB\u6570\uFF0C\u67D3\u6210\u7CFB\u5217\u8272\u4F1A\u88AB
   \u8BEF\u8BFB\u6210\u53C8\u4E00\u7EC4\u6570\u636E\uFF1BLABEL-09 \u8BA9\u997C\u56FE\u5F15\u7EBF\u8DDF\u968F\u7CFB\u5217\u8272\u7684\u524D\u63D0\u662F\u300C\u5F15\u7EBF\u5728\u627F\u62C5\u8272\u5F69\u5173\u8054\u300D\uFF0C
   \u800C\u6807\u6CE8\u7684\u5173\u8054\u7531\u300C\u7BAD\u5934\u6307\u7740\u5B83\u300D\u627F\u62C5\uFF0C\u989C\u8272\u4E0D\u5FC5\u518D\u8BF4\u4E00\u904D\u3002
   color \u6302\u5728\u6574\u7EC4\u4E0A\uFF0C\u73AF / \u5F15\u7EBF / \u7BAD\u5934\u4E00\u5F8B currentColor \u53D6\u4E4B\u2014\u2014\u672C\u6A21\u5757 JS \u5185\u96F6\u8272\u503C\u5B57\u9762\u91CF\u3002 */
.dv-callout {
  color: var(--color-visualization-highlight-line);
  pointer-events: none;
}
.dv-callout-ring {
  fill: none;
  stroke: currentColor;
  stroke-width: var(--size-callout-ring-stroke);
}
/* \u5B9E\u5FC3\u70B9\u53EA\u5728\u951A\u70B9\u5904**\u6CA1\u6709**\u65E2\u6709\u56FE\u5143\u65F6\u624D\u753B\uFF08\u67F1\u9876 / \u4EFB\u610F\u6570\u503C\u5750\u6807\u6863\uFF0CCALLOUT-04\uFF09 */
.dv-callout-dot { fill: currentColor; }
/* [CALLOUT-11] \u5F15\u7EBF\u7EBF\u5BBD\u590D\u7528\u5168\u5E93\u7EC6\u7EBF\u5BBD --size-grid-line\uFF08\u7F51\u683C\u7EBF / \u8F74\u7EBF / \u997C\u56FE\u5F15\u7EBF\u540C\u6E90\uFF09\uFF0C
   \u4E0D\u8BBE\u81EA\u6709 token\u2014\u2014\u5148\u4F8B\u4E0E\u7406\u7531\u89C1 .dv-pie-label-line\u3002 */
.dv-callout-leader {
  fill: none;
  stroke: currentColor;
  stroke-width: var(--size-grid-line);
}
/* [CALLOUT-12] \u7BAD\u5934\u662F\u624B\u5199\u4E09\u89D2 <path>\uFF0C\u4E0D\u7528 SVG <marker>\uFF08\u540C WATERFALL \u65B9\u5411\u5934\u4E0E CHORD-05\uFF09 */
.dv-callout-arrow {
  fill: currentColor;
  stroke: none;
}
/* [CALLOUT-13] \u26A0\uFE0F \u523B\u610F**\u4E0D\u590D\u7528 .dv-data-label**\uFF1A\u90A3\u5957\u5E26 font-family-number + tabular-nums
   + medium \u5B57\u91CD\uFF0C\u9690\u542B\u524D\u63D0\u662F\u300C\u5185\u5BB9\u662F\u6570\u5B57\u300D\uFF08PIE-15 \u5DF2\u4E3A\u6B64\u4ED8\u8FC7\u4E00\u6B21\u8D26\uFF09\u3002
   \u6807\u6CE8\u662F\u6574\u53E5\u6563\u6587 \u2192 \u6B63\u6587\u5B57\u4F53 + regular \u5B57\u91CD + \u901A\u7528\u6B63\u6587\u8272\uFF08\u968F\u660E\u6697\u6A21\u5F0F\u7FFB\u8F6C\uFF0C\u540C LABEL-09 \u6863\u2462\uFF09\u3002 */
.dv-callout-text {
  fill: var(--color-text-primary);
  font-size: var(--font-size-callout);
  font-weight: var(--font-weight-callout);
  font-family: var(--font-family-cn);
}

/* [TOOLTIP-01] \u6C14\u6CE1\u5361\u7247\uFF1A\u80CC\u666F/\u8FB9\u6846/\u9634\u5F71/\u5706\u89D2/\u5185\u8FB9\u8DDD/\u6700\u5927\u5BBD\u5EA6/\u5B57\u4F53\u5168\u8D70 token\u3002
   iFinD \u7279\u4F8B\uFF081px \u8FB9\u6846 + \u9634\u5F71 + Arial\uFF09\u7531\u5176 token \u503C\u5929\u7136\u751F\u6548\uFF0CTHS/Ainvest \u4E3A transparent/none \u65E0\u5F62\u3002
   pointer-events:none\u2014\u2014\u6C14\u6CE1\u6C38\u4E0D\u62A2\u9F20\u6807\uFF08\u8D34\u7740\u6307\u9488\u4E5F\u4E0D\u89E6\u53D1 mouseleave\uFF09\uFF1B\u65E0\u8FC7\u6E21\u52A8\u753B\uFF08TOOLTIP-10\uFF09\u3002
   [TOOLTIP-12] fixed \u89C6\u53E3\u5B9A\u4F4D\uFF1ADOM \u6302 plotHost\uFF08token \u4F5C\u7528\u57DF\uFF09\u4F46\u4E0D\u53D7\u7956\u5148 overflow \u88C1\u526A\uFF0C
   \u6C14\u6CE1\u53EF\u8D85\u51FA\u56FE\u8868 frame / \u5361\u7247\u5BB9\u5668\uFF1B\u5750\u6807\u7531 tooltip.js place() \u6309 plotHost \u89C6\u53E3\u77E9\u5F62\u6362\u7B97\u3002 */
.dv-tooltip {
  position: fixed;
  left: 0;
  top: 0;
  z-index: 10;
  display: none;
  pointer-events: none;
  box-sizing: border-box;
  /* \u5BBD\u5EA6=\u5185\u5BB9\u771F\u5B9E\u5BBD\uFF08TOOLTIP-02 \u4EE5\u6700\u957F\u4E00\u884C\u4E3A\u51C6\uFF09\u3002\u4E0D\u5199\u5219 absolute+left \u7684\u6536\u7F29\u5BBD\u5EA6
     \u53D7\u300Cleft\u2192\u5BB9\u5668\u53F3\u7F18\u300D\u5269\u4F59\u7A7A\u95F4\u7EA6\u675F\u2014\u2014\u6C14\u6CE1\u8D34\u53F3\u4FA7\u65F6\u53EF\u7528\u5BBD\u2248\u81EA\u8EAB\u5BBD\uFF0C\u4E9A\u50CF\u7D20\u53D6\u6574\u5DEE
     \u4F1A\u628A\u7CFB\u5217\u540D\u538B\u7F29\u6362\u884C */
  width: max-content;
  background: var(--color-visualization-tooltip);
  border: 1px solid var(--color-visualization-tooltip-border);
  box-shadow: var(--shadow-tooltip);
  border-radius: var(--radius-tooltip);
  padding: var(--spacing-tooltip-pad);
  /* [TOOLTIP-01] \u5BBD\u5EA6\u81EA\u9002\u5E94\u5185\u5BB9\uFF08width: max-content \u90A3\u6761\uFF09\uFF0C\u518D\u53D7**\u4E09\u9053**\u5C01\u9876\uFF1A
     \xB7 \u5185\u5BB9\u5C01\u9876 --size-tooltip-max-width \u2014\u2014 \u8D85\u8FC7\u5B83\u7684\u6587\u5B57\u6309 TOOLTIP-03 \u6362\u884C\uFF1B
     \xB7 \u89C6\u53E3\u5C01\u9876 \u2014\u2014 \u7A84\u5C4F\u4E0A\u4E24\u4FA7\u5404\u7559 spacing-24\uFF0C\u6C14\u6CE1\u6C38\u8FDC\u4E0D\u4F1A\u9876\u5230\u5C4F\u5E55\u8FB9\uFF1B
     \xB7 \u5BB9\u5668\u5C01\u9876 \u2014\u2014 \u56FE\u8868\u6839\u5BBD \xD7 --size-tooltip-max-container-ratio\uFF08\u76EE\u524D\u4EC5 THS \u79FB\u52A8\u7AEF 0.5\uFF09\u3002
     \u53D6\u6700\u5C0F\u8005\uFF0C\u6545\u5404\u9053\u72EC\u7ACB\u751F\u6548\uFF0C\u4E0D\u5FC5\u4E3A\u67D0\u4E00\u65CF\u6216\u67D0\u4E00\u7AEF\u53E6\u5199\u4E00\u6761\u89C4\u5219\u3002
     280px \u662F\u91CF\u51FA\u6765\u7684\u4E0D\u662F\u62CD\u7684\uFF1A\u5168\u65CF \xD7 \u4E09\u4E3B\u9898\u5B9E\u6D4B\u81EA\u7136\u5BBD 111\u2013228px\uFF08\u6700\u5BBD\u662F\u7011\u5E03\u56FE
     Ainvest \u7684\u590D\u5408\u8BFB\u6570 228\uFF09\uFF0C280 \u7559\u4E86\u7EA6\u4E24\u6210\u4F59\u91CF\uFF1B\u518D\u5BBD\u7684\u5185\u5BB9\uFF08\u5982\u300C\u8D85\u957F\u540D\u79F0\u300D
     \u8FB9\u754C\u7528\u4F8B\u7684 339px\uFF09\u672C\u5C31\u8BE5\u6362\u884C\uFF0C\u800C\u4E0D\u662F\u8BA9\u6C14\u6CE1\u9738\u5C4F\u3002 */
  max-width: min(
    var(--size-tooltip-max-width),
    calc(100vw - var(--spacing-24) - var(--spacing-24)),
    /* \u7B2C\u4E09\u9053\uFF1A\u5BB9\u5668\u5C01\u9876\uFF08THS \u79FB\u52A8\u7AEF = \u56FE\u8868\u6839\u5BBD\u7684 1/2\uFF0C\u7531 core/tooltip.js \u91CF\u597D\u5199\u5165\uFF09\u3002
       \u672A\u5199\u5165\u65F6\u56DE\u843D\u5230\u5185\u5BB9\u5C01\u9876\u672C\u8EAB\uFF0Cmin() \u7ED3\u679C\u4E0D\u53D8\u2014\u2014\u4E0D\u7528\u9B54\u6570\u515C\u5E95\u3002 */
    var(--dv-tooltip-container-cap, var(--size-tooltip-max-width))
  );
  font-family: var(--font-family-tooltip);
  font-size: var(--font-size-tooltip);
  font-weight: var(--font-weight-regular);
  line-height: 1.4;
}
.dv-tooltip.is-visible { display: block; }

/* [TOOLTIP-05] top-anchor \u6863\u4E0B\u4E09\u89D2\uFF1A\u989C\u8272\u968F\u6C14\u6CE1\u80CC\u666F\uFF1B\u51E0\u4F55\uFF08border-width\uFF09\u7531 tooltip.js \u5E38\u91CF\u5199\u5165 */
.dv-tooltip__arrow {
  display: none;
  position: absolute;
  top: 100%;
  border-style: solid;
  border-color: var(--color-visualization-tooltip) transparent transparent;
}

/* [TOOLTIP-01][TOOLTIP-02] \u6807\u9898\u884C\uFF1A\u4E0B\u8FB9\u6846 = iFinD \u5206\u5272\u7EBF\u7279\u4F8B\uFF08THS/Ainvest transparent \u53EA\u5360 1px \u65E0\u5F62\uFF09 */
.dv-tooltip__title {
  display: flex;
  align-items: center;
  gap: var(--spacing-8);
  color: var(--color-text-tooltip-title);
  padding-bottom: var(--spacing-tooltip-row);
  border-bottom: 1px solid var(--color-visualization-tooltip-divider);
  margin-bottom: var(--spacing-tooltip-row);
}
.dv-tooltip__title-icon {
  flex: none;
  width: var(--spacing-24);
  height: var(--spacing-24);
  object-fit: contain;
}
.dv-tooltip__title-icon-fallback {
  display: inline-flex;
  flex: none;
  align-items: center;
  justify-content: center;
  width: var(--spacing-24);
  height: var(--spacing-24);
  color: var(--color-text-primary);
  background: var(--color-background-layer1);
  border-radius: var(--radius-full);
  font-family: var(--font-family-cn);
  font-size: var(--font-size-tooltip);
  font-weight: var(--font-weight-bold);
}
.dv-tooltip__rows { display: flex; flex-direction: column; gap: var(--spacing-tooltip-row); }

/* [TOOLTIP-02][TOOLTIP-03] \u6570\u636E\u884C\uFF1Amarker \u72EC\u7ACB\u5217\uFF08\u60AC\u6302\u7F29\u8FDB\u5929\u7136\u6210\u7ACB\uFF09+ \u7CFB\u5217\u540D\u53EF\u6362\u884C +
   \u6570\u503C\u5355\u884C\u8D34\u53F3\uFF1Balign-items:flex-start = \u6570\u503C/marker \u9876\u5BF9\u9F50\u7CFB\u5217\u540D\u7B2C\u4E00\u884C */
.dv-tooltip__row { display: flex; align-items: flex-start; }
.dv-tooltip__marker {
  flex: none;
  margin-right: var(--spacing-legend-marker-label);
  /* marker \u76F8\u5BF9\u9996\u884C\u6587\u5B57\u7AD6\u76F4\u5C45\u4E2D\uFF081.4 = \u6C14\u6CE1\u884C\u9AD8\uFF09 */
  margin-top: calc((1.4em - var(--size-legend-marker)) / 2);
  color: var(--dv-series-color, currentColor);
}
.dv-tooltip__label {
  flex: 1 1 auto;
  min-width: 0;
  color: var(--color-text-tooltip-series);
  overflow-wrap: anywhere;
}
.dv-tooltip__value {
  flex: none;
  margin-left: auto;
  padding-left: var(--spacing-tooltip-row-gap); /* \u4E24\u5217\u6700\u5C0F\u95F4\u8DDD */
  color: var(--color-text-tooltip-value);
  font-weight: var(--font-weight-tooltip-value);
  white-space: nowrap; /* [TOOLTIP-03] \u6570\u503C\u6C38\u4E0D\u6362\u884C */
  font-variant-numeric: tabular-nums;
}

/* [TOOLTIP-08] X \u8F74\u7AD6\u6307\u793A\u7EBF\uFF1A\u7EBF\u8272/\u865A\u5B9E\u968F\u4E3B\u9898 token\uFF08iFinD \u865A\u7EBF 3 3\uFF09\uFF1B\u7EBF\u5BBD\u4E0E\u7F51\u683C\u7EBF\u540C\u6E90 */
.dv-crosshair-x {
  stroke: var(--color-visualization-highlight-line);
  stroke-width: var(--size-grid-line);
  stroke-dasharray: var(--dash-highlight-line);
}

/* [TOOLTIP-12] Y \u8F74\u6A2A\u6307\u793A\u7EBF\uFF1A\u4E0E\u7AD6\u7EBF**\u5171\u7528\u540C\u4E00\u7EC4 token**\u2014\u2014\u540C\u4E00\u4E2A hover \u6307\u793A\u8BED\u4E49\uFF0C\u4E0D\u56E0\u65B9\u5411\u5206\u53C9 */
.dv-crosshair-y {
  stroke: var(--color-visualization-highlight-line);
  stroke-width: var(--size-grid-line);
  stroke-dasharray: var(--dash-highlight-line);
}

/* [TOOLTIP-11] hover \u6307\u793A block\uFF08\u7EAF\u5206\u7EC4\u67F1\uFF09\uFF1A\u7C7B\u76EE\u5E95\u8272\u5E26\uFF08\u7F51\u683C\u4E4B\u4E0A\u3001mark \u4E4B\u4E0B\uFF09\uFF0C\u4E09\u4E3B\u9898\u540C token */
.dv-crosshair-block { fill: var(--color-visualization-highlight-block); }

/* [TOOLTIP-09] \u8F74\u9AD8\u4EAE\u8D34\u7247\uFF1Atext \u540C\u65F6\u6302 .dv-axis-label \u590D\u7528\u5168\u90E8\u5B57\u4F53\u89C4\u5219\uFF1B\u72B6\u6001\u7C7B\u53EA\u8986\u76D6\u5B57\u8272\u3002 */
.dv-axis-tag-bg { fill: var(--color-visualization-highlight-background-tick); }
.dv-axis-tag-text { fill: var(--color-text-highlight-tick); }

/* [DATAZOOM-04] \u7F29\u653E\u8F74 \xB7 \u8F68\u9053/\u6570\u636E\u9634\u5F71/\u9009\u533A\uFF1A\u8272\u5168\u8D70 \xA713\u300C\u7F29\u653E\u8F74 Axes Navigator\u300Dtoken\u3002
   \u7EAF\u89C6\u89C9\u5C42\uFF08\u80CC\u666F/\u6570\u636E\u9634\u5F71/\u63D0\u793A\u6587\u672C/grip\uFF09\u5173\u6307\u9488\uFF0C\u4EA4\u4E92\u53EA\u7531\u900F\u660E\u70ED\u533A + \u9009\u533A + \u624B\u67C4\u63A5\u7BA1\u3002 */
.dv-datazoom-bg { fill: var(--color-background-weak); pointer-events: none; }
.dv-datazoom-data { fill: var(--color-datazoom-data-bg); pointer-events: none; }
.dv-datazoom-data-select { fill: var(--color-datazoom-data-select); pointer-events: none; }
.dv-datazoom-filler { fill: var(--color-datazoom-filler); }

/* [DATAZOOM-03] \u624B\u67C4\uFF1A\u586B\u5145/\u8FB9\u6846/grip \u8D70 \xA713 \u624B\u67C4 token\uFF1B\u672C\u4ED3\u5E93\u4EE3\u7801\u73B0\u753B\uFF08\u975E SVG \u56FE\u7247\u8D44\u6E90\uFF09\u3002
   1px \u63CF\u8FB9\u4E3A\u7ED3\u6784\u5E38\u91CF\uFF08\u540C .dv-tooltip \u7684 1px \u8FB9\u6846\u53E3\u5F84\uFF09\uFF0C\u975E\u8272\u503C\u5B57\u9762\u91CF\u3002 */
.dv-datazoom-handle {
  fill: var(--color-datazoom-handle);
  stroke: var(--color-datazoom-handle-border);
  stroke-width: var(--size-slider-handle-border);
  filter: var(--shadow-datazoom-handle); /* [DATAZOOM-03] \u624B\u67C4\u6295\u5F71\uFF1A\u4EC5 Ainvest \u6709\u503C\uFF0CTHS/iFinD \u4E3A none */
}
.dv-datazoom-grip {
  stroke: var(--color-datazoom-handle-grip);
  stroke-width: 1.5;
  stroke-linecap: round;
  pointer-events: none;
}

/* [DATAZOOM-05] \u63D0\u793A\u6587\u672C\uFF1A\u5B57\u4F53\u4E0E\u8F74\u6807\u7B7E\u540C\u6E90\uFF0C\u8272\u8D70\u8F74\u6587\u672C token\u3002
   \u9ED8\u8BA4\u9690\u85CF\uFF0Chover \u7F29\u653E\u8F74\u6216\u62D6\u52A8\uFF08plotHost \u6302 .dz-dragging\uFF09\u65F6\u624D\u663E\u793A\u2014\u2014\u4E0D\u5E38\u663E\u3002 */
.dv-datazoom-label {
  fill: var(--color-text-axis);
  font-size: var(--font-size-axis);
  font-family: var(--font-family-number);
  font-variant-numeric: tabular-nums;
  pointer-events: none;
  opacity: 0;
}
.dv-datazoom:hover .dv-datazoom-label,
.dz-dragging .dv-datazoom-label { opacity: 1; }

/* SankeyChart \u7ED3\u6784\u6837\u5F0F\uFF1B\u9009\u62E9\u5668\u5168\u90E8\u9650\u5B9A\u5728 .dv-sankey \u547D\u540D\u7A7A\u95F4\u3002 */

.dv-sankey {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  min-width: var(--dv-sankey-render-width, 100%);
  font-family: var(--font-family-cn);
}

.dv-sankey__legend-host {
  flex: none;
  pointer-events: none;
}

.dv-sankey__legend-host .dv-legend-item {
  cursor: default;
}

.dv-sankey__svg {
  display: block;
  flex: none;
  width: var(--dv-sankey-render-width, 100%);
  max-width: none;
  height: var(--dv-sankey-render-height, auto);
  overflow: visible;
}

/* [SANKEY-08] \u5355\u8272\u8FB9\u5E26\uFF0C\u8272\u53D6\u7EC8\u8282\u70B9\u8BED\u4E49\u8272\uFF1B\u900F\u660E\u5EA6\u7531 Sankey L2 \u914D\u7F6E\u4E0B\u53D1\u3002
   [SANKEY-20] \u900F\u660E\u7C97\u63CF\u8FB9\u53EA\u4E3A\u6491\u51FA\u547D\u4E2D\u533A\uFF08\u7EC6\u5E26\u4E5F\u8981\u70B9\u5F97\u4E2D\uFF09\u3002**\u4E0D\u8981\u7ED9\u547D\u4E2D\u5143\u7D20\u663E\u5F0F\u5199 pointer-events**\uFF1A
   \u9ED8\u8BA4\u7684 visiblePainted \u5DF2\u7ECF\u8BA4\u8FD9\u5708\u63CF\u8FB9\uFF08stroke \u662F\u771F\u5B9E\u989C\u8272\uFF0C\u53EA\u662F stroke-opacity: 0\uFF09\uFF0C
   \u800C\u663E\u5F0F\u503C\u4F1A\u76D6\u8FC7**\u7EE7\u627F\u6765\u7684** pointer-events: none\u2014\u2014\u753B\u5ECA\u9884\u89C8\u5361\u7247\u6B63\u662F\u9760\u7EE7\u627F\u5173\u6389\u4EA4\u4E92\u7684
   \uFF08index.html \u7684 .example-card__preview .chart-host\uFF09\uFF0C\u5199\u6B7B\u5C31\u4F1A\u8BA9\u5361\u7247\u91CD\u65B0\u63A5\u7BA1\u9F20\u6807\u3002 */
.dv-sankey__edge-ribbon {
  fill: var(--dv-sankey-color);
  fill-opacity: var(--dv-sankey-edge-opacity);
  stroke: var(--dv-sankey-color);
  stroke-width: var(--spacing-8);
  stroke-opacity: 0;
  vector-effect: non-scaling-stroke;
  cursor: pointer;
}

.dv-sankey__node-rect {
  fill: var(--dv-sankey-color);
  cursor: pointer;
}

.dv-sankey__node-label {
  fill: var(--color-text-primary);
  font-weight: var(--font-weight-regular);
  pointer-events: none;
}

/* [SANKEY-20] \u900F\u660E\u77E9\u5F62\u63A5\u7BA1\u6807\u7B7E\u533A\u57DF\u7684\u547D\u4E2D\uFF1Bfill \u662F transparent\uFF08\u4E0D\u662F none\uFF09\uFF0C\u6545 visiblePainted \u8BA4\u5B83\uFF0C
   \u540C\u6837\u4E0D\u5199 pointer-events\uFF0C\u7406\u7531\u89C1\u4E0A\u9762 .dv-sankey__edge-ribbon\u3002 */
.dv-sankey__node-label-hit {
  fill: transparent;
  cursor: pointer;
}

.dv-sankey__node-title {
  fill: var(--color-text-primary);
  font-family: var(--font-family-cn);
}

.dv-sankey__edge-label {
  fill: var(--color-text-secondary);
  font-family: var(--font-family-number);
  font-size: var(--font-size-xxs);
  font-weight: var(--font-weight-medium);
  pointer-events: none;
  font-variant-numeric: tabular-nums;
}

.dv-sankey__node-value {
  fill: var(--dv-sankey-color);
  font-family: var(--font-family-number);
  font-weight: var(--font-weight-medium);
  font-variant-numeric: tabular-nums;
}

.dv-sankey .dv-tooltip__title,
.dv-sankey .dv-tooltip__marker {
  display: none;
}

.dv-sankey .dv-tooltip__row {
  align-items: center;
}

.dv-sankey .dv-tooltip__value {
  color: var(--dv-sankey-tooltip-value-color);
  font-family: var(--font-family-number);
}

/* [SANKEY-16] \u8D1F\u53F7\u53EA\u8868\u8FBE\u6570\u503C\u65B9\u5411\uFF0C\u4E0D\u8986\u76D6\u6536\u5165/\u652F\u51FA/\u5229\u6DA6\u8282\u70B9\u7684\u4E1A\u52A1\u8BED\u4E49\u8272\u3002 */
.dv-sankey__node-value.is-negative,
.dv-sankey__edge-label.is-negative {
  fill: var(--color-text-primary);
}

/* [SANKEY-10] \u9AD8\u4EAE\u53EA\u6539\u53D8\u53EF\u89C1\u5EA6\uFF0C\u4E0D\u6539\u53D8\u8BED\u4E49\u8272\u6216\u91CD\u65B0\u6392\u5E8F\u3002 */
.dv-sankey__edge.is-active .dv-sankey__edge-ribbon {
  fill-opacity: var(--dv-sankey-edge-highlight-opacity);
}

.dv-sankey__edge.is-dimmed,
.dv-sankey__node.is-dimmed,
.dv-sankey__node-label.is-dimmed {
  opacity: var(--opacity-visualization-dim);
}

.dv-sankey__edge:focus,
.dv-sankey__node:focus {
  outline: none;
}

.dv-sankey__node:focus .dv-sankey__node-rect {
  stroke: var(--color-text-primary);
  stroke-width: var(--size-grid-line);
  vector-effect: non-scaling-stroke;
}

/* \u2500\u2500 \u96F7\u8FBE\u56FE Radar\uFF08specs/radar.md\uFF09\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
   \u672C\u65CF\u65E0\u5750\u6807\u8F74\u3001\u65E0\u76F4\u89D2\u7F51\u683C\uFF1A\u7F51\u683C\u662F\u540C\u5FC3\u73AF / \u6B63\u591A\u8FB9\u5F62\uFF0C\u6307\u793A\u662F\u6247\u5F62\u9AD8\u4EAE\u3002
   \u989C\u8272\u3001\u5B57\u53F7\u3001\u7C97\u7EC6\u4E00\u5F8B\u8D70 token\uFF08\u62FC\u63A5\u94C1\u5F8B 1\uFF0C\u6E90\u7801\u7981\u8272\u503C\u4E0E\u5B57\u4F53\u5B57\u9762\u91CF\uFF09\u3002 */

/* [RADAR-08] \u56FE\u4F8B\u5728\u56FE\u8868\u4E0A\u65B9\uFF08\u9ED8\u8BA4\u4E0A\u4E0B\u5E03\u5C40\u3001\u5C45\u4E0A\u5DE6\u5BF9\u9F50\uFF09\uFF1B\u7ED8\u56FE\u533A\u5438\u6EE1\u5269\u4F59\u9AD8\u5EA6\u3002
   [RADAR-09] \`--dv-radar-min-h\` \u7531 L2 \u6309\u300C\u89E6\u5E95\u534A\u5F84\u7684\u753B\u5E03 + \u56FE\u4F8B + \u95F4\u8DDD\u300D\u7B97\u51FA\u2014\u2014\u4F4E\u4E8E\u5B83\uFF0C
   \u9876\u90E8\u8F74\u6807\u7B7E\u4F1A\u53E0\u8FDB\u56FE\u4F8B\u3002\u7F3A\u7701 0 = \u7EC4\u4EF6\u8FD8\u6CA1\u753B\u5B8C\u65F6\u4E0D\u65BD\u52A0\u7EA6\u675F\uFF0C\u514D\u5F97\u9996\u5E27\u6491\u51FA\u4E00\u4E2A\u5047\u9AD8\u5EA6\u3002 */
.dv-chart--radar {
  display: flex;
  flex-direction: column;
  min-height: var(--dv-radar-min-h, 0);
}

.dv-chart--radar > .dv-chart__legend { flex: none; }

.dv-chart--radar > .dv-chart__plot {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* [RADAR-15][COLOR-10] \u5206\u533A\u80CC\u666F\u4E0E\u6570\u636E\u56FE\u5143\u5206\u5C42\uFF1A\u8FD9\u91CC\u53EA\u63A7\u5236\u7EDF\u4E00\u53EF\u89C1\u5EA6\uFF0C\u5177\u4F53\u8272\u9636\u7531
   L1 visual-color \u8FD4\u56DE token \u5F15\u7528\u3001L2 \u88C5\u6210\u8FDE\u7EED\u5F84\u5411\u6E10\u53D8\u6216\u79BB\u6563\u540C\u5FC3\u8272\u5E26\u3002 */
.dv-radar-rating {
  opacity: var(--opacity-radar-rating-background);
  pointer-events: none;
}

.dv-radar-rating-surface,
.dv-radar-rating-band {
  stroke: none;
  pointer-events: none;
}

.dv-radar-rating-band { fill: var(--dv-radar-rating-color); }

/* [RADAR-15] Figma 51086:57384\uFF1A\u5206\u533A\u8BF4\u660E\u5728\u96F7\u8FBE\u56FE\u4E0B\u65B9\u3002\u6E10\u53D8\u6761\u4E0E\u56FE\u9762\u76F4\u5F84\u540C\u5BBD\uFF1B
   \u5206\u6BB5\u6863\u7531 L2 \u6309\u8BBE\u8BA1\u6BD4\u4F8B\u6269\u5BBD\u3002\u8272\u5757\u76F4\u63A5\u6D88\u8D39\u4E0E\u80CC\u666F\u76F8\u540C\u7684\u72EC\u7ACB\u4E94\u6863 / \u516D\u6863 token\uFF0C\u6587\u5B57\u662F\u56FE\u8868\u5185\u5BB9\u3002 */
.dv-chart--radar > .dv-radar-rating-scale {
  flex: none;
  align-self: center;
  width: var(--dv-radar-rating-scale-width);
  margin-top: var(--dv-radar-rating-scale-margin-top);
  color: var(--color-text-primary);
  font-family: var(--font-family-en);
  font-size: var(--font-size-radar-label-name);
  line-height: var(--line-height-radar-label-name);
  font-weight: var(--font-weight-regular);
  font-variant-numeric: tabular-nums;
}

.dv-radar-rating-scale__gradient {
  width: 100%;
  height: var(--size-radar-rating-scale-height);
  /* 50% of the bar height, not CSS 50% of its 180px width (which forms an ellipse). */
  border-radius: calc(var(--size-radar-rating-scale-height) / 2);
  background: var(--dv-radar-rating-gradient);
}

.dv-radar-rating-scale__range-labels {
  display: flex;
  justify-content: space-between;
  gap: var(--spacing-radar-rating-scale-label-gap);
  margin-top: var(--spacing-radar-rating-scale-label-gap);
  white-space: nowrap;
}

.dv-radar-rating-scale__bands {
  display: grid;
  grid-template-columns: repeat(var(--dv-radar-rating-level-count), minmax(0, 1fr));
}

.dv-radar-rating-scale__item {
  display: flex;
  min-width: 0;
  flex-direction: column;
  align-items: center;
  gap: var(--spacing-radar-rating-scale-label-gap);
}

.dv-radar-rating-scale__swatch {
  display: block;
  width: 100%;
  height: var(--size-radar-rating-scale-height);
  background: var(--dv-radar-rating-color);
}

.dv-radar-rating-scale__label { white-space: nowrap; }

/* [RADAR-03] \u7F51\u683C\u73AF\u7EBF\uFF1A\u53EA\u63CF\u8FB9\u4E0D\u586B\u5145\u3002\u586B\u5145\u4EA4\u7ED9\u4E0B\u9762\u7684\u73AF\u5E26\uFF0C\u4E24\u8005\u5206\u5F00\u662F\u6709\u539F\u56E0\u7684\u2014\u2014
   \u7ED9\u73AF\u7EBF\u672C\u8EAB\u4E0A fill \u4F1A\u586B\u6210**\u6574\u5706**\uFF0C\u5185\u5708\u76D6\u4F4F\u5916\u5708\u3001\u989C\u8272\u4E00\u8DEF\u94FA\u5230\u5706\u5FC3\u3002 */
.dv-radar-ring {
  fill: none;
  stroke: var(--color-radar-grid);
  stroke-width: var(--size-radar-grid-line);
  vector-effect: non-scaling-stroke;
}

/* [RADAR-03] \u95F4\u9694\u586B\u5145\u7684**\u73AF\u5E26**\uFF1A\u5916\u8F6E\u5ED3 + \u5185\u8F6E\u5ED3\u4E24\u6761\u5B50\u8DEF\u5F84 + evenodd \u6316\u7A7A = \u771F\u6B63\u7684\u5706\u73AF\u3002
   \u4E00\u73AF\u4E00\u8272\uFF0C\u6700\u5916\u5708\u4E0D\u586B\uFF08\u4FDD\u6301\u9875\u9762\u5E95\u8272\uFF09\u3002\u53EA\u505A\u89C6\u89C9\u3001\u4E0D\u53C2\u4E0E\u547D\u4E2D\u3002 */
.dv-radar-band {
  fill: var(--color-radar-grid-fill);
  stroke: none;
  pointer-events: none;
}

/* [RADAR-02] \u5F84\u5411\u8F74\uFF1A\u81EA\u5706\u5FC3\u5230\u6700\u5916\u5708\uFF0C\u4E0E\u7F51\u683C\u7EBF\u540C\u4E00\u5957\u89C6\u89C9\u6743\u91CD */
.dv-radar-axis {
  stroke: var(--color-radar-grid);
  stroke-width: var(--size-radar-grid-line);
  vector-effect: non-scaling-stroke;
}

/* [RADAR-06] \u591A\u8FB9\u5F62\uFF1A\u63CF\u8FB9\u6052\u672C\u8272\uFF0C\u586B\u5145\u9ED8\u8BA4 10%\uFF1B\u9489\u4F4F\u6001\u6362\u6210\u672C\u8272\u5B9E\u586B\uFF08\u57FA\u7EBF 8.2 / 8.3\uFF09\u3002
   --dv-radar-color \u7531 L2 \u9010\u7CFB\u5217\u5199\u5728\u5143\u7D20\u4E0A\uFF0C\u6307\u5411\u8BE5\u7CFB\u5217\u7684\u56FA\u5B9A\u8272\u69FD\u3002
   \u26A0\uFE0F **\u9762\u4E0E\u7EBF\u5206\u5C5E\u4E24\u5C42**\uFF08\u9762\u5168\u5728\u4E0B\u3001\u7EBF\u5168\u5728\u4E0A\uFF0C\u89C1 radar/index.js\uFF09\uFF0C\u6545\u4E24\u8FB9\u5404\u81EA\u53D6\u8272\u2014\u2014
   \u9762\u4E0D\u518D\u662F\u7CFB\u5217 <g> \u7684\u540E\u4EE3\uFF0C\u7EE7\u627F\u4E0D\u5230\u90A3\u4EFD currentColor\u3002 */
.dv-radar-series,
.dv-radar-area { color: var(--dv-radar-color); }

/* [RADAR-15] \u5206\u533A\u80CC\u666F\u5DF2\u7ECF\u627F\u62C5\u6570\u503C\u8272\u9636\uFF0C\u6570\u636E\u8F6E\u5ED3\u56FA\u5B9A\u7528\u9ED1\u8272\uFF0C\u907F\u514D\u518D\u5F15\u5165\u7CFB\u5217\u8272\u8BED\u4E49\u3002
   \u9762\u4ECD\u4FDD\u7559\u7CFB\u5217\u8272\u7684\u4F4E\u900F\u660E\u586B\u5145\uFF1B\u6B64\u5904\u53EA\u8986\u76D6\u6298\u7EBF\u53CA\u5176\u76F4\u7EBF\u6863\u6570\u636E\u70B9\u3002 */
.dv-chart--radar-rating .dv-radar-series {
  color: var(--color-radar-rating-line);
}

/* \u5206\u533A\u8272\u5E26\u672C\u8EAB\u5C31\u662F\u9762\u79EF\u7F16\u7801\uFF1B\u518D\u53E0\u7CFB\u5217\u9762\u79EF\u8272\u4F1A\u6C61\u67D3\u8272\u9636\uFF0C\u4F7F\u56FE\u5185\u989C\u8272\u4E0E\u5E95\u90E8\u8BF4\u660E\u5931\u914D\u3002 */
.dv-chart--radar-rating .dv-radar-area {
  fill: none;
}

.dv-radar-area {
  fill: currentColor;
  fill-opacity: var(--opacity-radar-area);
  stroke: none;
  pointer-events: none;
}

.dv-radar-area--pinned { fill-opacity: 1; }

.dv-radar-line {
  fill: none;
  stroke: currentColor;
  stroke-width: var(--size-radar-area-stroke);
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

/* [RADAR-05] \u6570\u636E\u5706\u70B9\uFF1A\u66F2\u7EBF\u6863\u7531 L2 \u76F4\u63A5\u4E0D\u6E32\u67D3\uFF08\u57FA\u7EBF 8.4\u300C\u66F2\u7EBF\u5C55\u793A\u65F6\u9ED8\u8BA4\u9690\u85CF\u5706\u70B9\u300D\uFF09\uFF0C
   \u6545\u8FD9\u91CC\u53EA\u7BA1\u76F4\u7EBF\u6863\u7684\u6837\u5F0F\uFF0C\u4E0D\u7528 display \u53BB\u85CF\u2014\u2014\u85CF\u8D77\u6765\u7684\u8282\u70B9\u4ECD\u5728 DOM \u91CC\u5F92\u589E\u547D\u4E2D\u9762\u3002 */
.dv-radar-point {
  r: calc(var(--size-radar-point) / 2);
  fill: currentColor;
  pointer-events: none;
}

/* [RADAR-18] \u53EF\u8C03\u8282\u5F62\u6001\uFF1A\u89C6\u89C9\u5706\u4E0E\u547D\u4E2D\u533A\u5747\u4E3A 36\xD736\u3002\u6807\u51C6\u5F62\u6001\u7528 grey-80 / 80%\uFF1B
   \u5206\u533A\u5F62\u6001\u6539\u7528\u9ED1\u8272 / 50%\uFF0C\u8BA9\u624B\u67C4\u538B\u5728\u9AD8\u9971\u548C\u5206\u533A\u5E95\u8272\u4E0A\u4ECD\u4FDD\u6301\u4E00\u81F4\u3002\u5185\u90E8\u7BAD\u5934\u6052 100%\u3002 */
.dv-radar-handle {
  cursor: grab;
  touch-action: none;
}

.dv-radar-handle.is-dragging { cursor: grabbing; }

.dv-radar-handle-hit {
  r: calc(var(--size-radar-handle-hit) / 2);
  fill: transparent;
}

.dv-radar-handle-thumb {
  r: calc(var(--size-radar-handle) / 2);
  fill: var(--color-radar-handle-background);
  fill-opacity: var(--opacity-radar-handle);
  stroke: none;
}

.dv-chart--radar-rating .dv-radar-handle-thumb {
  fill: var(--color-radar-rating-handle-background);
  fill-opacity: var(--opacity-radar-rating-handle);
}

.dv-radar-handle-grip {
  fill: var(--color-radar-handle-arrow);
  stroke: none;
  pointer-events: none;
}

/* [RADAR-18] \u66F2\u7EBF\u53EF\u8C03\u8282\u6001\u7684\u771F\u5B9E\u6570\u636E\u951A\u70B9\uFF1A\u4F4D\u4E8E\u66F2\u7EBF\u4E0E\u624B\u67C4\u5185\u7F18\u7684\u63A5\u70B9\u3002
   \u5B83\u4E0D\u662F\u5E38\u89C4\u7CFB\u5217\u5706\u70B9\uFF08RADAR-05 \u4ECD\u9690\u85CF\uFF09\uFF0C\u53EA\u7528\u4E8E\u8BF4\u660E\u624B\u67C4\u5B9E\u9645\u63A7\u5236\u7684\u66F2\u7EBF\u4F4D\u7F6E\u3002 */
.dv-radar-edit-anchor {
  r: calc(var(--size-radar-handle-anchor) / 2);
  fill: var(--color-text-tertiary);
  pointer-events: none;
}

.dv-radar-handle:focus { outline: none; }

/* [RADAR-11] \u6574\u7EC4\u53EF\u70B9\uFF1A\u9489\u4F4F\u8BE5\u7CFB\u5217 */
.dv-radar-series { cursor: pointer; }

/* [RADAR-07] \u8F74\u6807\u7B7E\u4E24\u6BB5\u3002\u540D\u79F0\u6BB5\u662F**\u975E\u6570\u5B57\u6587\u672C**\uFF0C\u6545\u4E0D\u590D\u7528 .dv-data-label \u90A3\u5957
   \uFF08\u90A3\u5957\u7684\u9690\u542B\u524D\u63D0\u662F\u300C\u5185\u5BB9\u662F\u6570\u5B57\u300D\uFF1Amedium \u5B57\u91CD + \u6570\u5B57\u5B57\u4F53 + tabular-nums\uFF0C\u89C1 PIE-15 \u7684\u5751\uFF09\u3002 */
.dv-radar-label-name,
.dv-radar-label-value {
  pointer-events: none;
  font-weight: var(--font-weight-radar-label);
}

.dv-radar-label-name {
  fill: var(--color-text-primary);
  font-family: var(--font-family-cn);
  font-size: var(--font-size-radar-label-name);
}

.dv-radar-label-value {
  fill: var(--color-text-secondary);
  font-family: var(--font-family-number);
  font-size: var(--font-size-radar-label-value);
  font-variant-numeric: tabular-nums;
}

  if (action === 'financial-density' && ['compact','standard'].includes(value)) state.financialDensity = value;
  if (action === 'board-density' && ['compact','standard'].includes(value)) activeModuleBoard().density = value;
  if (action === 'board-columns' && [1,2,3,4,5].includes(Number(value))) activeModuleBoard().columns = Number(value);
  if (action === 'module-select') { selectPreviewModule(value);return; }
  if (action === 'module-picker') { openModal(`${modalHead('添加可视化模块')}<p>Ainvest · ${state.scene==='aime'?'对话组件':'可视化组件'} · 共 ${compactTypes.length} 种</p>${[...new Set(compactTypes.map(t=>t.group))].map(group=>`<div class="compact-picker-group"><h3>${group}</h3>${compactTypes.filter(t=>t.group===group).map(t=>`<button class="export-choice" data-modal-action="add-module" data-value="${t.id}"><span><strong>${t.name}</strong></span></button>`).join('')}</div>`).join('')}`); return; }
  if(['module-move-up','module-move-down','module-hide','module-show','module-show-all'].includes(action)){
    const board=activeModuleBoard(),id=value||board.selected;
    if(action==='module-show-all'){for(const module of board.modules)module.hidden=false;board.selected||=board.modules[0]?.id;}
    else if(action==='module-hide'||action==='module-show')setCompactModuleHidden(board,id,action==='module-hide');
    else {const visible=board.modules.filter(m=>!m.hidden);moveCompactModule(board,id,visible.findIndex(m=>m.id===id)+(action==='module-move-up'?-1:1));board.selected=id;}
    persist();render();
    if(action==='module-show'||action.startsWith('module-move'))document.querySelector(`[data-module-id="${id}"]`)?.scrollIntoView({block:'nearest'});
    return;
  }
  if (action === 'module-duplicate') { const selected = activeModuleBoard().modules.find(m => m.id === activeModuleBoard().selected); if(selected && activeModuleBoard().modules.length < 60) { const added = {...selected, id:crypto.randomUUID()}; activeModuleBoard().modules.splice(activeModuleBoard().modules.indexOf(selected)+1,0,added); activeModuleBoard().selected=added.id; } }
  if (action === 'module-remove') { activeModuleBoard().modules=activeModuleBoard().modules.filter(m=>m.id!==activeModuleBoard().selected); activeModuleBoard().selected=activeModuleBoard().modules.find(m=>!m.hidden)?.id; }
  if (action === 'theme') { state.theme = value; state.editorOpen = false; }
  if (action === 'mode') state.mode = value;
  if (action === 'collapse') state.collapsed = !state.collapsed;
  if (action === 'panel') { state.panel = value; state.editorOpen = false; }
  if (action === 'role') { state.role = value; state.selected = 0; state.editorOpen = false; }
  if (action === 'color') { state.selected = Number(value); state.editorOpen = true; }
  if (action === 'undo' && history.length) { future.push(clone(state.draft)); state.draft = history.pop(); state.mode = 'draft'; }
  if (action === 'redo' && future.length) { history.push(clone(state.draft)); state.draft = future.pop(); state.mode = 'draft'; }
  if (action === 'reset' && changedCount()) { remember(); state.draft = clone(state.baseline); state.mode = 'draft'; toast('已恢复原始色板，可撤销此操作'); }
  if (action === 'copy-oklch') {
    try { await navigator.clipboard.writeText(oklchCss(hexToOklch(current().themes[state.theme][state.role][state.selected].hex)));toast('已复制 OKLCH 色值'); } catch {toast('无法访问剪贴板，请从 OKLCH 文本手动复制');}
    return;
  }
  if (action === 'copy-color') {
    const hex = current().themes[state.theme][state.role][state.selected].hex;
    try { await navigator.clipboard.writeText(hex); toast(`已复制 ${hex}`); } catch { toast('无法访问剪贴板，请从色值输入框手动复制'); }
    return;
  }
  if (action === 'save') {
    openModal(`${modalHead('保存候选方案')}<p>保存当前色板的两个主题，之后可从「我的方案」中继续使用。</p><label for="save-name">方案名称</label><input id="save-name" class="modal-input" maxlength="80" value="${esc(state.draft.name + ' · 调整版')}"><div class="modal-actions"><button class="button" data-modal-action="close">取消</button><button class="button primary" data-modal-action="save">保存方案</button></div>`); return;
  }
  if (action === 'export') {
    openModal(`${modalHead('导出与分享')}<p>导出的 JSON 可在其他设备上导入。完整实验文件可以复现本次比较条件。</p><button class="export-choice" data-modal-action="export-palette">${icon('file')}<span><strong>导出当前色板</strong><small>颜色角色、浅深主题、来源信息</small></span></button><button class="export-choice" data-modal-action="export-session">${icon('copy')}<span><strong>导出完整实验</strong><small>A/B 色板、当前场景、主题与工具版本</small></span></button><div class="editor-footnote">当前查看 ${state.mode === 'baseline' ? 'A · 原始基线' : 'B · 调整后色板'}；色板导出与当前查看版本一致。</div>`); return;
  }
  if (action === 'import-mode' && ['text','code'].includes(value)) { importInputMode=value;pendingImport=null;importError=''; }
  if (action === 'example' && importInputMode === 'text') { importLightText='#265FFC #38D1FF #F564B9 #733ED6 #00CCC3 #273D8F #FF7040';importDarkText='';pendingImport=null;importError=''; }
  if (action === 'example' && importInputMode === 'code') { importText = '[\n  "#265FFC",\n  "#38D1FF",\n  "#F564B9",\n  "#733ED6",\n  "#00CCC3"\n]'; pendingImport = null; importError = ''; }
  if (action === 'parse') { try { pendingImport = importInputMode === 'text' ? {candidates:[parseTextPalette(importLightText,importDarkText)]} : parseImport(importText); importedIndex = 0; importError = ''; } catch (error) { pendingImport = null; importError = error.message; } }
  if (action === 'apply-import' && pendingImport) {
    if (pendingImport.session) {
      const s = pendingImport.session; state.customTemplate=[...comparisonTemplates.map(t=>t.id),'free'].includes(s.customTemplate)?s.customTemplate:'all';state.comparisonBoards=validateComparisonBoards(s.comparisonBoards); state.globalChartStyle=normalizeGlobalChartStyle(s.globalChartStyle); state.checkSettings=normalizeCheckSettings(s.checkSettings); state.financialBoard = validateFinancialBoard(s.financialBoard); state.financialDensity = s.financialDensity === 'standard' ? 'standard' : 'compact'; if (s.customBoard) state.customBoard = validateCompactBoard(s.customBoard); if(s.aimeBoard)state.aimeBoard=validateAimeBoard(s.aimeBoard); stashDraft(); state.baseline = clone(s.baseline); state.draft = clone(s.draft); state.draft.id = crypto.randomUUID(); state.baseline.id = state.draft.id;
      state.scene = scenes.some(v => v.id === s.scene) ? s.scene : 'financial'; state.theme = ['light', 'dark'].includes(s.theme) ? s.theme : 'light'; history = []; future = [];
    } else { const p = clone(pendingImport.candidates[importedIndex]); p.name = importName.trim() || p.name; p.id = crypto.randomUUID(); const sourceName=p.name;let suffix=2;while([...presets,...state.saved].some(v=>v.name===p.name))p.name=sourceName+' '+suffix++;state.saved.push(clone(p)); state.saved = state.saved.slice(-30); applyPalette(p); }
    state.mode = 'draft'; state.panel = 'palette'; state.editorOpen = false; state.role = 'categorical'; state.selected = 0; pendingImport = null; toast('已导入，可以开始调整颜色');
  }
  persist(); render();
});
modal.addEventListener('click', async e => {
  if (e.target.closest('[data-modal-action="copy-mobile-link"]')) {
    const field = document.querySelector('#mobile-share-url');
    try { await navigator.clipboard.writeText(field.value); toast('已复制手机预览链接'); }
    catch { field.focus(); field.select(); toast('请复制已选中的链接'); }
    return;
  }
  const target = e.target.closest('[data-modal-action]'); if (!target) return;
  const action = target.dataset.modalAction;
  if (action === 'rename-palette') {
    const palette=state.saved.find(p=>p.id===target.dataset.value);if(!palette)return;
    const name=document.querySelector('#rename-name').value.trim();
    const error=document.querySelector('#rename-error');
    if(!name){error.textContent='请输入色板名称';document.querySelector('#rename-name').focus();return;}
    if([...presets,...state.saved].some(p=>p.id!==palette.id&&p.name===name)){error.textContent='已有同名色板，请换一个名称';return;}
    palette.name=name;
    if(state.draft.id===palette.id)state.draft.name=name;
    if(state.baseline.id===palette.id)state.baseline.name=name;
    persist();modal.close();render();toast('色板名称已更新');return;
  }
  if (action === 'close') modal.close();
  if (action === 'add-module') { if(activeModuleBoard().modules.length >= 60) { toast('最多展示 60 个模块'); return; } const added=newCompactModule(target.dataset.value); const board=activeModuleBoard(); const index=board.modules.findIndex(m=>m.id===board.selected); if(state.scene==='aime')board.modules.splice(index+1,0,added);else board.modules.push(added); activeModuleBoard().selected=added.id; persist(); modal.close(); render(); document.querySelector(`[data-module-id="${added.id}"]`)?.scrollIntoView({block:'nearest'}); }
  if (action === 'save') {
    const name = document.querySelector('#save-name').value.trim();
    if (!name) { document.querySelector('#save-name').focus(); return; }
    state.saved.push({ ...clone(state.draft), id: crypto.randomUUID(), name }); state.saved = state.saved.slice(-30); persist(); modal.close(); render(); toast(`已保存「${name}」`);
  }
  if (action === 'export-palette') { download(current(), 'palette-lab-colors.json'); modal.close(); toast('已导出色板文件'); }
  if (action === 'export-session') {
    download({ kind: 'palette-lab-session', schemaVersion: 1, toolVersion: VERSION, exportedAt: new Date().toISOString(), scene: state.scene, theme: state.theme, baseline: state.baseline, draft: state.draft, customTemplate:state.customTemplate, comparisonBoards:state.comparisonBoards, customBoard: state.customBoard, aimeBoard: state.aimeBoard, financialDensity: state.financialDensity, financialBoard: state.financialBoard, checkSettings: state.checkSettings, globalChartStyle: state.globalChartStyle }, 'palette-lab-experiment.json'); modal.close(); toast('已导出完整实验文件');
  }
});
modal.addEventListener('click', e => { if (e.target === modal) { const r = modal.getBoundingClientRect(); if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) modal.close(); } });
document.addEventListener('keydown', async e => {
  if (e.target.closest?.('.palette-tabs') && ['ArrowLeft','ArrowRight','Home','End'].includes(e.key)) {
    e.preventDefault();const tabs=[...document.querySelectorAll('.palette-tab')],index=tabs.indexOf(e.target.closest('.palette-tab'));
    const next=e.key==='Home'?0:e.key==='End'?tabs.length-1:(index+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;tabs[next]?.click();tabs[next]?.focus({preventScroll:true});return;
  }
  if (e.key === 'Escape' && state.previewFullscreen && !modal.open) { e.preventDefault(); await setPreviewFullscreen(false); return; }
  if (e.target.closest?.('[data-color-role]') && ['Enter', ' '].includes(e.key)) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); return; }
  if (!(e.metaKey || e.ctrlKey) || e.key.toLowerCase() !== 'z' || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || modal.open) return;
  e.preventDefault(); document.querySelector(`[data-action="${e.shiftKey ? 'redo' : 'undo'}"]`)?.click();
});
render();
if (mobileShareError) toast(mobileShareError);
else if (sharedPreviewLoaded) toast('已载入分享的 Aime 方案');
else if (loaded) toast('已恢复上次的色板与实验设置');
</script>
  </head>
  <body>
    <div id="app"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <dialog id="modal" aria-labelledby="modal-title"></dialog>
  </body>
